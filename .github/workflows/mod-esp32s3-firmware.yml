name: ModESP32 S3 Firmware (Web Flash)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main/boards/mod-esp32s3-st7789v-28/**"
      - "main/audio/**"
      - "main/display/**"
      - "main/CMakeLists.txt"
      - "main/Kconfig.projbuild"
      - "scripts/build.py"
      - "sdkconfig.defaults*"
      - ".github/workflows/mod-esp32s3-firmware.yml"

permissions:
  contents: read

concurrency:
  group: mod-esp32s3-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build custom ESP32-S3 board
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          idf.py --version
          python3 scripts/build.py mod-esp32s3-st7789v-28 --name mod-esp32s3-st7789v-28

      - name: Verify merged firmware
        shell: bash
        run: |
          set -euo pipefail
          test -s build/merged-binary.bin
          sha256sum build/merged-binary.bin > build/SHA256SUMS
          ls -lh build/merged-binary.bin

      - name: Upload browser-flashable firmware
        uses: actions/upload-artifact@v4
        with:
          name: mod-esp32s3-st7789v-28-${{ github.sha }}
          path: |
            build/merged-binary.bin
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish-development:
    name: Publish immutable Development firmware
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: mod-esp32s3-st7789v-28-${{ github.sha }}
          path: firmware

      - name: Validate package and publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd firmware
          test -s merged-binary.bin
          sha256sum --check SHA256SUMS
          # Immutable tag per commit; never overwrite a prior test firmware.
          TAG="mod-esp32s3-dev-${SOURCE_SHA:0:12}"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Not overwriting."
            exit 0
          fi
          gh release create "$TAG" merged-binary.bin SHA256SUMS \
            --repo "$GH_REPO" \
            --target "$SOURCE_SHA" \
            --title "ModESP32 ESP32-S3 Development ${SOURCE_SHA:0:12}" \
            --notes "Experimental ESP32-S3 N16R8 / ST7789V build. Not hardware-validated. Source: $SOURCE_SHA. Do not treat this as a stable release." \
            --prerelease --latest=false
