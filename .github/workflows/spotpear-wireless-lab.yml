name: Spotpear Wireless Lab (isolated)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/spotpear-wireless-lab
    paths:
      - 'firmware/spotpear-wireless-lab/**'
      - '.github/workflows/spotpear-wireless-lab.yml'
  pull_request:
    paths:
      - 'firmware/spotpear-wireless-lab/**'
      - '.github/workflows/spotpear-wireless-lab.yml'

permissions:
  contents: read

jobs:
  spotpear-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: espressif/idf:v5.3.2
    defaults:
      run:
        working-directory: firmware/spotpear-wireless-lab
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build Spotpear standalone ESP-IDF project
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Package experimental binaries
        run: |
          set -euo pipefail
          test -s build/spotpear_wireless_lab.bin
          sha256sum build/*.bin > build/SHA256SUMS
      - name: Upload CI-only artifact (NOT hardware validated)
        uses: actions/upload-artifact@v4
        with:
          name: spotpear-wireless-lab-experimental
          path: |
            firmware/spotpear-wireless-lab/build/*.bin
            firmware/spotpear-wireless-lab/build/flasher_args.json
            firmware/spotpear-wireless-lab/build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
