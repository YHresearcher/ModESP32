name: Deploy ModESP32 Web Flasher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web-flasher/**'
      - '.github/workflows/agentesp32-web-flasher-deploy.yml'

permissions:
  contents: read

concurrency:
  group: agentesp32-web-flasher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker and frontend
        run: |
          set -euo pipefail
          node --check web-flasher/app.js
          node --check web-flasher/spotpear-flasher.mjs
          node --check web-flasher/_worker.js
          node --test web-flasher/tests/*.test.mjs
      - name: Confirm Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
      - name: Deploy to existing agentesp32 Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web-flasher
          command: deploy
      - name: Verify live Worker availability
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 3 'https://agentesp32.hlthanh1992.workers.dev/' -o /dev/null
          curl -fsS --retry 3 --retry-delay 3 'https://agentesp32.hlthanh1992.workers.dev/spotpear-flasher.mjs' -o /dev/null
