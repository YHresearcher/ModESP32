name: Deploy Chibi Cloudflare Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chibi-cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: chibi-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chibi-cloudflare
    defaults:
      run:
        working-directory: cloudflare/chibi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chibi-cloudflare-free-v1

      - name: Check required secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEVICE_TOKEN: ${{ secrets.CHIBI_DEVICE_TOKEN }}
        run: |
          set -euo pipefail
          for key in CF_TOKEN CF_ACCOUNT GEMINI_KEY DEVICE_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing secret: $key. Add required values to GitHub Actions environment chibi-cloudflare."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run bundle

      - name: Deploy Worker first
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/chibi
          command: deploy

      - name: Set runtime secrets on deployed Worker
        working-directory: cloudflare/chibi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHIBI_DEVICE_TOKEN: ${{ secrets.CHIBI_DEVICE_TOKEN }}
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(JSON.stringify({GEMINI_API_KEY:process.env.GEMINI_API_KEY,CHIBI_DEVICE_TOKEN:process.env.CHIBI_DEVICE_TOKEN}))' \
            | npx wrangler secret bulk

      - name: Smoke test live Vietnamese voice roundtrip
        working-directory: cloudflare/chibi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHIBI_DEVICE_TOKEN: ${{ secrets.CHIBI_DEVICE_TOKEN }}
          CHIBI_WS_URL: wss://chibi-esp32.hlthanh1992.workers.dev/ws
        run: npm run smoke
